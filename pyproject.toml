[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kahm"
version = "0.1.0"
description = "Kernel Affine Hull Machines with a scikit-learn classification interface"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Mohit Kumar", email = "mohit.kumar@uni-rostock.de" },
]
dependencies = [
  "numpy>=1.24,<3",
  "joblib>=1.3,<2",
  "scikit-learn>=1.6,<2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.8,<4"]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.urls]
Repository = "https://github.com/MohitKumarRostock/KAHM"
Issues = "https://github.com/MohitKumarRostock/KAHM/issues"
Documentation = "https://github.com/MohitKumarRostock/KAHM#readme"

[tool.setuptools]
packages = ["kahm"]
py-modules = [
  "autoencoder",
  "autoencoder_filtering_extended",
  "combine_multiple_autoencoders_extended",
  "dim_reduce",
  "distance_matrix",
  "kahm_classification",
  "kahm_regression",
  "kernel_regularized_least_squares",
  "kxa_matrix",
  "kxx_matrix",
  "parallel_autoencoders",
  "q_kahm",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
